include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: ^3.2.0

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/core/l10n/app_localizations*.dart

linter:
  rules:
    avoid_print: true
    prefer_single_quotes: true
    use_super_parameters: true
    unawaited_futures: true
